<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="style.css">
	<link rel="shortcut icon" href="imagens/check.svg" type="image/x-icon">
	<title>tudu</title>
</head>

<body>
	<header class="cabecalho">
		<img class="img-header-logo" src="imagens/logo-tudu.png" alt="logo">
		<img class="img-header" id="logo-texto" src="imagens/logo-tudu-text.png" alt="logo-tudu">
		<a href=""><img class="img-header" src="imagens/theme-change.png" alt="mudar-tema"></a>
	</header>
	<div id="linha"></div>
	<main class="conteudo">
		<div class="conteiner d-flex flex-column flex-md-row justify-content-around align-items-center">
			<input id="add-tarefa" type="button" onclick="openAddTask()"value="adicionar tarefa" data-bs-toggle="modal" data-bs-target="#taskModal">
			<div class="dropdown">
				<a class="btn btn-secondary dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
					aria-expanded="false">filtrar</a>
				<ul class="dropdown-menu">
					<li><a class="dropdown-item" href="#" onclick="filterTasks('concluidas')">concluídas</a></li>
					<li><a class="dropdown-item" href="#" onclick="filterTasks('naoConcluidas')">a fazer</a></li>
					<li><a class="dropdown-item" href="#" onclick="filterTasks('todas')">todas</a></li>
				</ul>
			</div>
			<img id="molas" oncontextmenu="return false;" ondragstart="return false;" src="imagens/molas.png" alt="molas-caderno">
		</div>
		
		<div class="div-tarefas">
			<h2 id="texto-tarefa">suas tarefas</h2>
			<div id="linha-tarefa"></div>
			<div id="task-container"></div>
		</div>
	</main>
	<div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="taskModalLabel">adicionar tarefa</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<form id="task-form">
						<div class="mb-3">
							<label for="task-title" class="form-label">título</label>
							<input type="text" class="form-control" id="task-title" required>
						</div>
						<div class="mb-3">
							<label for="task-tags" class="form-label">tags</label>
							<input type="text" class="form-control" id="task-tags" placeholder="trabalho, pessoal, etc.">
						</div>
						<div class="mb-3">
							<label for="task-status" class="form-label">status</label>
							<select class="form-select" id="task-status">
								<option class="opcao-status" value="naoConcluida">não concluída</option>
								<option class="opcao-status" value="concluida">concluída</option>
							</select>
						</div>
						<button id="btn-add" type="submit" class="btn btn-primary">adicionar</button>
					</form>
				</div>
			</div>
		</div>
	</div>

	<footer id="footer"><h5 id="credito">desenvolvido por nicolly almeida</h5></footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="app.js"></script>
</body>
